<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650">
  <defs>
    <!-- Background & Card Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B11"/>
      <stop offset="100%" stop-color="#121824"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B2232" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0F1520" stop-opacity="0.8"/>
    </linearGradient>
    
    <!-- Neon Accents -->
    <linearGradient id="neon-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>
    <linearGradient id="neon-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B927FC"/>
      <stop offset="100%" stop-color="#F25797"/>
    </linearGradient>
    <linearGradient id="neon-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38EF7D"/>
      <stop offset="100%" stop-color="#11998E"/>
    </linearGradient>
    <linearGradient id="neon-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAD961"/>
      <stop offset="100%" stop-color="#F76B1C"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow-teal" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-gold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="650" fill="url(#bg-grad)" rx="16"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <path d="M 100 0 L 100 650 M 200 0 L 200 650 M 300 0 L 300 650 M 400 0 L 400 650 M 500 0 L 500 650 M 600 0 L 600 650 M 700 0 L 700 650 M 800 0 L 800 650 M 900 0 L 900 650" />
    <path d="M 0 100 L 1000 100 M 0 200 L 1000 200 M 0 300 L 1000 300 M 0 400 L 1000 400 M 0 500 L 1000 500 M 0 600 L 1000 600" />
  </g>

  <!-- Title Section -->
  <text x="50" y="55" font-family="'Outfit', 'Inter', sans-serif" font-size="24" font-weight="800" fill="#FFFFFF" letter-spacing="1">CODEFRAME NATIVE BACKEND</text>
  <text x="50" y="80" font-family="'Inter', sans-serif" font-size="13" font-weight="500" fill="#8E9AA8">ADHD-Optimized Conceptual Architecture &amp; Directory Restructuring</text>
  
  <!-- Folder Tag / Breadcrumb -->
  <g transform="translate(680, 42)">
    <rect width="270" height="32" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <text x="15" y="20" font-family="monospace" font-size="12" fill="#58A6FF">src/x-lang/backend/native/</text>
  </g>

  <!-- ==================== STAGE 1: ENTRY & IR ==================== -->
  
  <!-- Entry Point Card (Native Compiler) -->
  <g transform="translate(50, 240)" filter="url(#shadow)">
    <rect width="180" height="150" rx="12" fill="url(#card-grad)" stroke="url(#neon-gold)" stroke-width="1.5" />
    <rect width="180" height="4" rx="2" fill="url(#neon-gold)" filter="url(#glow-gold)"/>
    <text x="20" y="35" font-family="'Outfit', 'Inter', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">🚀 Entry Point</text>
    <text x="20" y="60" font-family="monospace" font-size="12" fill="#FAD961">native_compiler</text>
    <text x="20" y="80" font-family="'Inter', sans-serif" font-size="11" fill="#8E9AA8">
      <tspan x="20" dy="0">Coordinates AST</tspan>
      <tspan x="20" dy="16">lowering to IR</tspan>
      <tspan x="20" dy="16">and routing to</tspan>
      <tspan x="20" dy="16">target backends.</tspan>
    </text>
  </g>

  <!-- IR Card (ir/ Subfolder) -->
  <g transform="translate(300, 240)" filter="url(#shadow)">
    <rect width="180" height="150" rx="12" fill="url(#card-grad)" stroke="#30363D" stroke-width="1" />
    <rect width="180" height="4" rx="2" fill="#8E9AA8" />
    <!-- Folder Icon -->
    <path d="M 20 20 L 20 40 L 40 40 L 40 25 L 30 25 L 25 20 Z" fill="#8E9AA8" opacity="0.3"/>
    <text x="20" y="35" font-family="'Outfit', 'Inter', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">🧠 Linear IR</text>
    <text x="20" y="60" font-family="monospace" font-size="12" fill="#8E9AA8">ir/</text>
    <text x="20" y="82" font-family="'Inter', sans-serif" font-size="11" fill="#C9D1D9">
      <tspan x="20" dy="0">ir.h</tspan>
      <tspan x="20" dy="16">ir_analyzer.h</tspan>
      <tspan x="20" dy="16">ir_generator.h / .cpp</tspan>
    </text>
    <text x="20" y="132" font-family="'Inter', sans-serif" font-size="10" font-style="italic" fill="#8E9AA8">AST → Flat Instruction Stream</text>
  </g>

  <!-- Arrow: Entry to IR -->
  <path d="M 230 315 L 290 315" fill="none" stroke="url(#neon-gold)" stroke-width="2" marker-end="url(#arrow)" />
  
  <!-- ==================== THREE PIPELINES ==================== -->
  
  <!-- 1. Bytecode VM Pipeline (Top) -->
  <g transform="translate(560, 110)" filter="url(#shadow)">
    <rect width="390" height="130" rx="12" fill="url(#card-grad)" stroke="url(#neon-teal)" stroke-width="1.5"/>
    <rect width="390" height="4" rx="2" fill="url(#neon-teal)" filter="url(#glow-teal)"/>
    <text x="20" y="32" font-family="'Outfit', 'Inter', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">💻 VM &amp; Interpreter Pipeline</text>
    <text x="20" y="55" font-family="monospace" font-size="12" fill="#00F2FE">vm/</text>
    
    <!-- File badges -->
    <g transform="translate(20, 72)">
      <rect width="105" height="22" rx="4" fill="#00F2FE" fill-opacity="0.1" stroke="#00F2FE" stroke-opacity="0.3"/>
      <text x="8" y="15" font-family="monospace" font-size="11" fill="#00F2FE">bytecode.h</text>
    </g>
    <g transform="translate(135, 72)">
      <rect width="135" height="22" rx="4" fill="#00F2FE" fill-opacity="0.1" stroke="#00F2FE" stroke-opacity="0.3"/>
      <text x="8" y="15" font-family="monospace" font-size="11" fill="#00F2FE">bytecode_compiler</text>
    </g>
    <g transform="translate(280, 72)">
      <rect width="80" height="22" rx="4" fill="#00F2FE" fill-opacity="0.1" stroke="#00F2FE" stroke-opacity="0.3"/>
      <text x="8" y="15" font-family="monospace" font-size="11" fill="#00F2FE">vm.h/.cpp</text>
    </g>
    <text x="20" y="112" font-family="'Inter', sans-serif" font-size="10" fill="#8E9AA8">Compiles IR/AST to virtual byte instructions and interprets them directly.</text>
  </g>

  <!-- 2. Direct PE Compiler Pipeline (Middle) -->
  <g transform="translate(560, 260)" filter="url(#shadow)">
    <rect width="390" height="130" rx="12" fill="url(#card-grad)" stroke="url(#neon-purple)" stroke-width="1.5"/>
    <rect width="390" height="4" rx="2" fill="url(#neon-purple)" filter="url(#glow-purple)"/>
    <text x="20" y="32" font-family="'Outfit', 'Inter', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">🛠️ Direct Binary PE Compiler</text>
    <text x="20" y="55" font-family="monospace" font-size="12" fill="#F25797">codegen/pe/</text>
    
    <!-- File badges -->
    <g transform="translate(20, 72)">
      <rect width="110" height="22" rx="4" fill="#F25797" fill-opacity="0.1" stroke="#F25797" stroke-opacity="0.3"/>
      <text x="8" y="15" font-family="monospace" font-size="11" fill="#F25797">direct_compiler</text>
    </g>
    <g transform="translate(140, 72)">
      <rect width="105" height="22" rx="4" fill="#F25797" fill-opacity="0.1" stroke="#F25797" stroke-opacity="0.3"/>
      <text x="8" y="15" font-family="monospace" font-size="11" fill="#F25797">x86_64_encoder</text>
    </g>
    <g transform="translate(255, 72)">
      <rect width="115" height="22" rx="4" fill="#F25797" fill-opacity="0.1" stroke="#F25797" stroke-opacity="0.3"/>
      <text x="8" y="15" font-family="monospace" font-size="11" fill="#F25797">pe_writer &amp; linker</text>
    </g>
    <text x="20" y="112" font-family="'Inter', sans-serif" font-size="10" fill="#8E9AA8">Compiles IR directly to binary machine code, packs PE headers, links, writes EXE.</text>
  </g>

  <!-- 3. GNU Assembler Pipeline (Bottom) -->
  <g transform="translate(560, 410)" filter="url(#shadow)">
    <rect width="390" height="130" rx="12" fill="url(#card-grad)" stroke="url(#neon-green)" stroke-width="1.5"/>
    <rect width="390" height="4" rx="2" fill="url(#neon-green)" filter="url(#glow-green)"/>
    <text x="20" y="32" font-family="'Outfit', 'Inter', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">🧱 Assembly Generator (GNU GAS)</text>
    <text x="20" y="55" font-family="monospace" font-size="12" fill="#38EF7D">codegen/</text>
    
    <!-- File badges -->
    <g transform="translate(20, 72)">
      <rect width="115" height="22" rx="4" fill="#38EF7D" fill-opacity="0.1" stroke="#38EF7D" stroke-opacity="0.3"/>
      <text x="8" y="15" font-family="monospace" font-size="11" fill="#38EF7D">target_backend.h</text>
    </g>
    <g transform="translate(145, 72)">
      <rect width="130" height="22" rx="4" fill="#38EF7D" fill-opacity="0.1" stroke="#38EF7D" stroke-opacity="0.3"/>
      <text x="8" y="15" font-family="monospace" font-size="11" fill="#38EF7D">x86_64_backend.h/.cpp</text>
    </g>
    <text x="20" y="112" font-family="'Inter', sans-serif" font-size="10" fill="#8E9AA8">Generates standard GNU Assembler (.s) text files for native cross-compiling.</text>
  </g>

  <!-- Connector Lines & Routing Dots -->
  <!-- Main split hub -->
  <path d="M 480 315 L 520 315" fill="none" stroke="#8E9AA8" stroke-width="2"/>
  <circle cx="520" cy="315" r="4" fill="#8E9AA8"/>
  
  <!-- Line up to VM -->
  <path d="M 520 315 L 520 175 L 550 175" fill="none" stroke="url(#neon-teal)" stroke-width="2"/>
  <!-- Line straight to PE -->
  <path d="M 520 315 L 550 315" fill="none" stroke="url(#neon-purple)" stroke-width="2"/>
  <!-- Line down to GNU -->
  <path d="M 520 315 L 520 475 L 550 475" fill="none" stroke="url(#neon-green)" stroke-width="2"/>

  <!-- Flow Arrow Marker -->
  <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#8E9AA8" />
  </marker>
</svg>
